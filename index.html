<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manu</title>
<style>
  :root { --bg: #0e0c0f; --ink: #f4f1ea; --cyan: #5fd6ff; --blue: #4638e8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.2 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #fx { pointer-events: none; }
  #deck { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;
    max-width: calc(100vw - 32px); padding: 6px; border: 2px solid #000; border-radius: 999px;
    background: var(--ink); color: #000; box-shadow: 4px 4px 0 #000; }
  #deck button, #deck label { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border: 0; border-radius: 50%;
    background: none; color: inherit; cursor: pointer; }
  #deck button:hover, #deck label:hover { background: var(--cyan); }
  #deck :focus-visible, #deck label:focus-within { outline: 3px solid var(--blue); outline-offset: 1px; }
  #deck #play { background: var(--blue); color: #fff; }
  #deck #play:hover { background: #000; }
  #deck svg { width: 16px; height: 16px; fill: currentColor; }
  #title { min-width: 0; padding: 0 12px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  #deck input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  body.drop #deck { background: var(--cyan); }
</style>
</head>
<body>
<canvas id="gl" role="img" aria-label="Graffiti lettering that reads MANU, surrounded by piano keys, drums and game controllers"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="deck">
  <button id="prev" aria-label="Previous track"><svg viewBox="0 0 16 16"><path d="M2 2h2v12H2zM14 2v12L5 8z"/></svg></button>
  <button id="play" aria-label="Play"><svg viewBox="0 0 16 16"><path id="playIcon" d="M4 2l10 6-10 6z"/></svg></button>
  <button id="next" aria-label="Next track"><svg viewBox="0 0 16 16"><path d="M12 2h2v12h-2zM2 2v12l9-6z"/></svg></button>
  <span id="title" aria-live="polite"></span>
  <label aria-label="Add music files" title="Add music files (or drop them anywhere)">
    <svg viewBox="0 0 16 16"><path d="M7 2h2v5h5v2H9v5H7V9H2V7h5z"/></svg>
    <input id="files" type="file" accept="audio/*" multiple>
  </label>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="layers/layers.js"></script>
<script>
// Songs shipped with the site: drop files into music/ and list them here.
const TRACKS = ["music/test-beat.wav"];

// How each piece moves, chosen by its name in the PSD (folder name, or layer name for a loose layer).
//   still   never moves                                      (the sky and the white border)
//   ribbon  a wave travels along it, driven by the mids      (the keyboard, and what rides on it)
//   rumble  buzzes with the bass like a controller's motor   (the game pads)
//   drum    squashes and rings on every kick
//   bob     the notes' own dance                             (see "bob" in frame())
//   boil    the lines wobble like a rough pencil animation   (the sketch, when its folder is visible)
//   glow    swells with the volume                           (the shadow behind the letters)
//   jelly   squash-and-stretch bounce, one EQ band each      (the letters, and anything not listed)
const KIND = {
  bg: "still", "white border": "still",
  drum: "drum", "batería dos": "drum",
  videojuegos: "rumble",
  piano: "ribbon", barandas: "ribbon", skate: "ribbon", partitura: "ribbon",
  noptas: "bob", shadow: "glow", draft: "boil",
};
const PAGE = [0.055, 0.047, 0.059]; // the wall behind the poster, same as --bg in the CSS
// Screen pixels drawn per artwork pixel, at most. 1 = as sharp as the artwork itself.
// Lower it (0.75, 0.5) if a weak machine still struggles: fewer pixels, softer picture.
const MAX_SHARP = 1;

const $ = id => document.getElementById(id);
const cv = $("gl"), audio = $("audio"), title = $("title"), fx = $("fx");
// "reduce motion" system setting: gentle drift only, no shake, flash or ripples
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const calm = still ? 0.2 : 1, punch = still ? 0 : 1;

// ---- drawing: everything goes through one WebGL canvas ----
// Pass 1 draws the pieces (each bent in its own way) into an off-screen picture.
// Pass 2 puts that picture on screen through the "water": ripples, vignette, grain, brightness.
const gl = cv.getContext("webgl2", { alpha: false, antialias: false }) || cv.getContext("webgl", { alpha: false, antialias: false });
if (!gl) title.textContent = "This browser can't draw the visuals (no WebGL)";
const gl2 = gl && typeof WebGL2RenderingContext !== "undefined" && gl instanceof WebGL2RenderingContext;

const VERT = `
attribute vec2 a;
uniform vec4 rect, mat, view;   // rect: x,y,w,h in artwork px (padded)   mat: 2x2   view: artwork px -> screen
uniform vec2 origin, shift;
varying vec2 uv;
void main() {
  uv = a;
  vec2 q = rect.xy + a * rect.zw - origin;
  vec2 p = origin + vec2(mat.x * q.x + mat.y * q.y, mat.z * q.x + mat.w * q.y) + shift;
  gl_Position = vec4(p * view.xy + view.zw, 0., 1.);
}`;
const PIECE = `
precision highp float;
uniform sampler2D tex;
uniform vec4 rect;
uniform vec2 size;
uniform float pad, amp, split, t, seed;
uniform int kind;               // 1 ribbon, 2 boil, 0 plain
varying vec2 uv;
vec4 at(vec2 p) {               // p in piece px; nothing outside the piece
  vec2 q = p / size;
  return texture2D(tex, q) * step(0., q.x) * step(q.x, 1.) * step(0., q.y) * step(q.y, 1.);
}
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + 1.), f.x), f.y);
}
void main() {
  vec2 p = uv * rect.zw - pad;
  if (kind == 1) p.y -= sin((p.x + rect.x + pad) * 0.011 - t * 0.005) * amp; // artwork x: every ribbon rides one wave
  if (kind == 2) p += (vec2(noise(p * 0.02 + seed), noise(p * 0.02 + seed + 37.)) - .5) * amp;
  vec4 c = at(p);
  if (split > 0.) {             // red/cyan fringe, like a misprinted sticker
    vec4 red = vec4(1., .16, .35, 1.) * at(p - vec2(split, 0.)).a * .75;
    vec4 cyan = vec4(.24, .86, 1., 1.) * at(p + vec2(split, 0.)).a * .75;
    c += (red + cyan * (1. - red.a)) * (1. - c.a);
  }
  gl_FragColor = c;
}`;
const WATER = `
precision highp float;
uniform sampler2D tex;
uniform vec2 res;
uniform vec3 rip[4];            // x, y in screen px, age 0..1 (1 = finished)
uniform float px, bright, sat, vig, grain, t;
varying vec2 uv;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main() {
  vec2 p = uv * res, bend = vec2(0.);
  for (int i = 0; i < 4; i++) {
    float age = rip[i].z;
    if (age < 1.) {             // a ring of three crests running outward, fading as it goes
      vec2 d = p - rip[i].xy;
      float r = length(d) + .001;
      float x = (r - (1. - (1. - age) * (1. - age)) * 1250. * px) / (110. * px);
      bend += d / r * sin(x * 6.2832) * exp(-x * x * .9) * pow(1. - age, 1.5) * 30. * px;
    }
  }
  vec3 c = texture2D(tex, (p + bend) / res).rgb;
  c = mix(vec3(dot(c, vec3(.2126, .7152, .0722))), c, sat) * bright;
  c *= 1. - clamp((length(uv - .5) * 1.4142 - .45) / .8, 0., 1.) * vig;
  c += (hash(p + t) - .5) * grain;
  gl_FragColor = vec4(c, 1.);
}`;
function program(fragment) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, fragment === WATER ? "attribute vec2 a; varying vec2 uv; void main() { uv = a; gl_Position = vec4(a * 2. - 1., 0., 1.); }" : VERT], [gl.FRAGMENT_SHADER, fragment]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.bindAttribLocation(p, 0, "a");
  gl.linkProgram(p);
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) {
    const name = gl.getActiveUniform(p, i).name.replace("[0]", "");
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
function texture(source) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  if (source) {
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    if (gl2) { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); }
  }
  return tex;
}

const PAD = { ribbon: 48, boil: 16, jelly: 8 }; // room around a piece for its distortion to spill into
const n = ART.layers.length;
const pieces = ART.layers.map((L, i) => {
  const kind = i ? KIND[L.name] || "jelly" : "backdrop";
  const base = kind === "drum" || kind === "jelly"; // these stand on their base, the rest pivot on their centre
  const piece = { ...L, kind, pad: PAD[kind] || 0, ox: L.x + L.w / 2, oy: L.y + (base ? L.h : L.h / 2), tex: null };
  if (gl) {
    const im = new Image();
    im.onload = () => { piece.tex = texture(im); };
    im.src = "layers/" + L.src;
  }
  return piece;
});

let pieceProg, waterProg, scene, sceneTex;
if (gl) {
  pieceProg = program(PIECE); waterProg = program(WATER);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  sceneTex = texture();
  scene = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
}

const g = fx.getContext("2d");
let fitS = 1, dpr = 1, sharp = 1;
function fit() {
  // the whole poster always fits in the window, with a little wall around it
  fitS = Math.min(innerWidth / ART.w, innerHeight / ART.h) * 0.94;
  dpr = Math.min(2, devicePixelRatio || 1);
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
  // never draw more pixels than the artwork has: that is the whole cost of a frame
  sharp = Math.min(devicePixelRatio || 1, MAX_SHARP / fitS);
  cv.width = Math.round(innerWidth * sharp); cv.height = Math.round(innerHeight * sharp);
  if (gl) {
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cv.width, cv.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  }
}
addEventListener("resize", fit); fit();

let mx = 0, my = 0, sx = 0, sy = 0;
addEventListener("pointermove", e => { mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1; });

// water ripples on click: the artwork is seen through a sheet of water, nothing is drawn, the picture is only bent
const RIP = [0, 1, 2, 3].map(() => ({ x: 0, y: 0, t0: -1e9 }));
let ripNext = 0;
addEventListener("pointerdown", e => {
  if (still || e.target.closest("#deck")) return;
  Object.assign(RIP[ripNext++ % RIP.length], { x: e.clientX, y: e.clientY, t0: performance.now() });
});

// ---- audio ----
let ctx, analyser, bins, hz;
function wire() {
  if (ctx) return ctx.resume();
  ctx = new AudioContext();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.72;
  ctx.createMediaElementSource(audio).connect(analyser).connect(ctx.destination);
  bins = new Uint8Array(analyser.frequencyBinCount);
  hz = ctx.sampleRate / analyser.fftSize;
}
function level(lo, hi) { // average loudness between two frequencies, 0..1
  if (!bins) return 0;
  const a = Math.round(lo / hz), b = Math.max(a + 1, Math.round(hi / hz));
  let sum = 0;
  for (let k = a; k < b; k++) sum += bins[k];
  return sum / (b - a) / 255;
}
// one band per moving layer, log-spaced 40 Hz - 6 kHz
const cut = j => 40 * 150 ** (j / (n - 1));
// squared for punch; highs are quieter than lows in real music, so tilt them up
const energy = band => Math.min(1, level(cut(band), cut(band + 1)) ** 2 * (1 + 1.5 * band / (n - 1)));

// ---- particles: quiet ambient dust ----
const COLORS = ["#5fd6ff", "#6a5cff", "#ffe066", "#f4f1ea"];
const parts = [];
function drawParticles(dt, loud, treble) {
  if (parts.length < 90 && Math.random() < (0.05 + loud * 0.3) * dt)
    parts.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, vx: (Math.random() - 0.5) * 0.3,
      vy: -0.1 - Math.random() * 0.3, r: 0.6 + Math.random() * 1.6, life: 0, age: 0.002 + Math.random() * 0.003,
      c: COLORS[Math.random() * COLORS.length | 0] });
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, innerWidth, innerHeight);
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k];
    const v = dt * calm * (1 + loud * 1.5); // drifts a little faster when the music is loud
    p.x += p.vx * v; p.y += p.vy * v;
    p.life += p.age * dt;
    if (p.life >= 1) { parts[k] = parts[parts.length - 1]; parts.pop(); continue; }
    g.globalAlpha = Math.sin(p.life * Math.PI) * (0.3 + treble * 0.4); // fade in and out, twinkle with the highs
    g.fillStyle = p.c;
    g.beginPath(); g.arc(p.x - sx * p.r * 6, p.y - sy * p.r * 4, p.r * (1 + treble * 0.6), 0, 6.283); g.fill();
  }
}

// ---- frame ----
const RAD = Math.PI / 180, rnd = () => Math.random() - 0.5;
const rips = new Float32Array(12);
let last = 0, kick = 0, prevBass = 0, lastKick = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(3, (t - last) / 16.67); last = t; // 1 = one 60 fps frame
  sx += (mx - sx) * 0.06 * dt; sy += (my - sy) * 0.06 * dt;
  if (analyser) analyser.getByteFrequencyData(bins);
  const bass = level(40, 150), mids = level(250, 2000), treble = level(3000, 9000), loud = level(40, 6000);

  // kick = a sharp rise in the bass; decays over ~10 frames
  if ((bass - prevBass) / dt > 0.08 && bass > 0.4 && t - lastKick > 160) { kick = 1; lastKick = t; }
  prevBass = bass; kick *= 0.88 ** dt;

  drawParticles(dt, loud, treble);
  if (!gl) return;

  // pass 1: the pieces, into the off-screen picture
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(PAGE[0], PAGE[1], PAGE[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.useProgram(pieceProg.p);
  let u = pieceProg.u;
  // whole picture: zoom punch + shake on the kick
  const S = fitS * (1 + kick * 0.018 * punch), sh = kick * 7 * punch, shx = rnd() * sh, shy = rnd() * sh;
  gl.uniform4f(u.view, 2 * S / innerWidth, -2 * S / innerHeight,
    (-ART.w * S + shx * 2) / innerWidth, (ART.h * S - shy * 2) / innerHeight);
  // nothing is drawn outside the poster: a piece sliding past its edge is cut there, like the print
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(Math.round((innerWidth / 2 + shx - ART.w * S / 2) * sharp), Math.round((innerHeight / 2 - shy - ART.h * S / 2) * sharp),
    Math.round(ART.w * S * sharp), Math.round(ART.h * S * sharp));
  gl.uniform1f(u.t, t);
  gl.uniform1f(u.seed, Math.floor(t / 110) % 100 * 7.13); // new wobble ~9 times a second, like drawings shot on twos
  for (let i = 0; i < n; i++) {
    const P = pieces[i];
    if (!P.tex) continue;
    const d = i / (n - 1);             // depth: 0 far (the backdrop, which stays put), 1 near
    let x = -sx * d * 44 * calm, y = (-sy * d * 30 + Math.sin(t / 1400 + i * 1.7) * 5 * d) * calm;
    let rot = 0, skew = 0, scx = 1, scy = 1, amp = 0, split = 0, kind = 0;
    switch (P.kind) {
      case "still": x = y = 0; break;
      case "bob": {
        const e = energy(n - 1 - i);   // 0..1, how loud this piece's own slice of the music is
        // TODO(human): make the notes dance. Change any of: x, y (px), rot (degrees), scx, scy (1 = normal size).
        // Available: e (above), t (ms), kick (1 on a bass hit, fading to 0), loud, mids, treble (0..1), calm, d (depth).
        break;
      }
      case "ribbon": kind = 1; amp = Math.min(P.pad - 4, 3 + mids * mids * 60) * calm; break;
      case "boil": kind = 2; amp = still ? 0 : 5 + loud * 16; break;
      case "rumble": {
        const b = Math.max(0, bass - 0.35) ** 2 * 14 * punch;
        x += rnd() * b; y += rnd() * b; rot = rnd() * b * 0.08;
        break;
      }
      case "drum": skew = Math.sin(t * 0.08) * kick * 2.5 * punch; scx = 1 + kick * 0.05 * calm; scy = 1 - kick * 0.09 * calm; break;
      case "glow": scx = scy = 1 + loud * 0.06 * calm; break;
      case "jelly": {
        const e = energy(n - 1 - i);   // front pieces get the bass
        y -= e * d * 48 * calm;
        rot = Math.sin(t / 700 + i * 2.1) * e * d * 3 * calm;
        scx = 1 - e * 0.05 * calm; scy = 1 + e * 0.13 * calm;
        split = e * d * 7 * punch; if (split < 0.4) split = 0;
      }
    }
    const co = Math.cos(rot * RAD), si = Math.sin(rot * RAD), tk = Math.tan(skew * RAD);
    gl.uniform4f(u.mat, co * scx, (co * tk - si) * scy, si * scx, (si * tk + co) * scy); // rotate * skew * scale
    gl.uniform2f(u.origin, P.ox, P.oy);
    gl.uniform2f(u.shift, x, y);
    gl.uniform4f(u.rect, P.x - P.pad, P.y - P.pad, P.w + P.pad * 2, P.h + P.pad * 2);
    gl.uniform2f(u.size, P.w, P.h);
    gl.uniform1f(u.pad, P.pad); gl.uniform1f(u.amp, amp); gl.uniform1f(u.split, split); gl.uniform1i(u.kind, kind);
    gl.bindTexture(gl.TEXTURE_2D, P.tex);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // pass 2: onto the screen, through the water
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.disable(gl.BLEND); gl.disable(gl.SCISSOR_TEST);
  gl.useProgram(waterProg.p);
  u = waterProg.u;
  RIP.forEach((r, k) => rips.set([r.x * sharp, (innerHeight - r.y) * sharp, Math.min(1, (t - r.t0) / 1800)], k * 3));
  gl.uniform3fv(u.rip, rips);
  gl.uniform2f(u.res, cv.width, cv.height);
  gl.uniform1f(u.px, fitS * sharp);
  gl.uniform1f(u.bright, 1 + kick * 0.12 * punch);
  gl.uniform1f(u.sat, 1 + loud * 0.6);
  gl.uniform1f(u.vig, 0.5 - kick * 0.3 * punch); // light, so the poster's white border stays white
  gl.uniform1f(u.grain, 0.04 + treble * 0.2);
  gl.uniform1f(u.t, still ? 0 : t % 1000 * 0.017);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(frame);

// ---- player ----
const nameOf = s => decodeURIComponent(s.split("/").pop()).replace(/\.\w+$/, "");
const list = TRACKS.map(src => ({ src, name: nameOf(src) }));
let cur = 0;
function load(i, play) {
  if (!list.length) { title.textContent = "Drop an mp3 here"; return; }
  cur = (i + list.length) % list.length;
  audio.src = list[cur].src;
  title.textContent = list[cur].name;
  if (play) start();
}
function start() { wire(); audio.play().catch(() => {}); }
function addFiles(files) {
  const songs = [...files].filter(f => f.type.startsWith("audio/"));
  if (!songs.length) return;
  const first = list.length;
  for (const f of songs) list.push({ src: URL.createObjectURL(f), name: f.name.replace(/\.\w+$/, "") });
  load(first, true);
}
$("play").onclick = () => !list.length ? $("files").click() : audio.paused ? start() : audio.pause();
$("prev").onclick = () => load(cur - 1, true);
$("next").onclick = () => load(cur + 1, true);
$("files").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
audio.onended = () => load(cur + 1, true);
audio.onerror = () => { if (list.length) title.textContent = "Can't play " + list[cur].name; };
audio.onplay = audio.onpause = () => {
  $("playIcon").setAttribute("d", audio.paused ? "M4 2l10 6-10 6z" : "M3 2h4v12H3zM9 2h4v12H9z");
  $("play").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
};
addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drop"); });
addEventListener("dragleave", () => document.body.classList.remove("drop"));
addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drop"); addFiles(e.dataTransfer.files); });
if (gl) load(0);
</script>
</body>
</html>
